name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${pair%/*}; arch=${pair#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT" \
              -o dist/netwatch-$os-$arch ./cmd/netwatch
          done
          cd dist
          tar czf netwatch-linux-amd64.tar.gz netwatch-linux-amd64
          tar czf netwatch-linux-arm64.tar.gz netwatch-linux-arm64
          zip netwatch-darwin-amd64.zip netwatch-darwin-amd64
          zip netwatch-darwin-arm64.zip netwatch-darwin-arm64
          sha256sum netwatch-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netwatch-*
            dist/checksums.txt
